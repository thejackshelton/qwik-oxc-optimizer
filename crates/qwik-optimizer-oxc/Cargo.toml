[package]
name = "qwik-optimizer-oxc"
version = "0.1.0"
edition = "2024"
description = "Qwik optimizer using OXC for code transformation"
license = "MIT"

[features]
default = ["parallel", "source-maps"]

# Enable parallel module transformation via rayon.
# Disable for single-threaded environments (WASM).
parallel = ["dep:rayon"]

# Enable source map generation.
source-maps = []

[dependencies]
# OXC umbrella crate -- provides parser, AST, traverse, codegen, semantic analysis, transformer.
# The "transformer" feature enables oxc_transformer for TypeScript type stripping (BUG-01).
# Import management is implemented directly in import_rewrite.rs and the exit_program hook.
oxc = { version = "0.113", features = [
    "codegen",      # oxc_codegen for AST -> JavaScript output
    "semantic",     # oxc_semantic for SemanticBuilder (scope/symbol analysis)
    "serialize",    # ESTree JSON serialization (for debugging/testing)
    "ast_visit",    # VisitMut trait for const_replace pre-pass
    "transformer",  # oxc_transformer for TypeScript type stripping before Qwik transform
] }
# NOTE: oxc always includes oxc_parser and oxc_traverse (no feature flags needed).

# oxc_traverse is a separate crate needed for the Traverse trait.
oxc_traverse = "0.113"

# Serialization for TransformOutput, SegmentAnalysis, and all public types.
serde = { version = "1", features = ["derive"] }

# JSON encoding/decoding for transform options and output.
serde_json = "1"

# Error handling with context chains.
anyhow = "1"

# Base64 encoding for segment hash computation and source maps.
base64 = "0.22"

# Parallel module transformation.
# Only included when "parallel" feature is active.
rayon = { version = "1", optional = true }

# Relative path computation for import paths between segments.
pathdiff = "0.2"

# Cross-platform path normalization (consistent / separators).
path-slash = "0.2"

[dev-dependencies]
# Snapshot testing for comparing output against 162 spec files.
insta = { version = "1", features = ["json"] }

# Lightweight regex for hash replacement in snapshots (no proc-macro overhead).
regex-lite = "0.1"
